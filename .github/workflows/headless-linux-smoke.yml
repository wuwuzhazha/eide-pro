name: Headless Linux Smoke

on:
  push:
    branches:
      - 'smoke/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-failure-contract:
    name: Failing build contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v5

      - name: Init submodules
        timeout-minutes: 5
        run: git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --recursive

      - name: Setup Node.js 18
        timeout-minutes: 5
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        timeout-minutes: 15
        run: npm ci

      - name: Setup .NET runtime
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ARM GNU toolchain
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$file" ] || continue
            sudo sed -i \
              -e 's#az[0-9]*\.archive\.ubuntu\.com#us-east-2.ec2.archive.ubuntu.com#g' \
              -e 's#azure\.archive\.ubuntu\.com#us-east-2.ec2.archive.ubuntu.com#g' \
              "$file"
          done
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install -y --no-install-recommends gcc-arm-none-eabi

      - name: Build headless bundles
        timeout-minutes: 15
        run: npm run webpack:headless

      - name: Assert failing build contract
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -r test/e2e/fixtures/cortex-m3 "$work/project"
          sed -i 's/counter++;/counter++/' "$work/project/src/main.c"
          grep -q 'counter++$' "$work/project/src/main.c"
          status=0
          node dist/eide_cli.js build --project "$work/project" --toolchain-path /usr --timeout 120000 \
            > "$work/result.json" 2> "$work/stderr.log" || status=$?
          echo "exit code: $status"
          cat "$work/result.json"
          if [ "$status" -ne 2 ]; then
            echo "::error::expected exit code 2, got $status"
            tail -n 50 "$work/stderr.log"
            exit 1
          fi
          if [ "$(jq -r '.success' "$work/result.json")" != "false" ]; then
            echo "::error::expected success=false"
            exit 1
          fi
          if [ "$(jq -r '.failureKind' "$work/result.json")" != "build" ]; then
            echo "::error::expected failureKind=build"
            exit 1
          fi
          if [ "$(jq -r '.artifacts | length' "$work/result.json")" != "0" ]; then
            echo "::error::expected empty artifacts"
            exit 1
          fi
          echo "failure contract verified"
