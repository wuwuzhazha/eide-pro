name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init submodules
        run: git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --recursive

      - name: Setup Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build extension and headless bundles
        run: npm run vscode:prepublish

      - name: Verify build artifacts
        shell: bash
        run: |
          missing=()
          for artifact in extension.js mcp_server.js eide_cli.js eide_mcp.js; do
            if [ ! -f "dist/$artifact" ]; then
              missing+=("dist/$artifact")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing build artifacts: ${missing[*]}"
            exit 1
          fi

  headless-package:
    name: Headless package E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Init submodules
        run: git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --recursive

      - name: Setup Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup .NET runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install ARM GNU toolchain
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for file in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$file" ] || continue
            sudo sed -i \
              -e 's#az[0-9]*\.archive\.ubuntu\.com#us-east-2.ec2.archive.ubuntu.com#g' \
              -e 's#azure\.archive\.ubuntu\.com#us-east-2.ec2.archive.ubuntu.com#g' \
              "$file"
          done
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install -y --no-install-recommends gcc-arm-none-eabi

      - name: Install QEMU and GDB
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install -y --no-install-recommends qemu-system-arm gdb-multiarch

      - name: Build extension and headless bundles
        run: npm run vscode:prepublish

      - name: Package headless distribution
        run: npm run package:headless

      - name: Run installed-package E2E
        run: npm run test:headless-package

      - name: Assert failing build contract
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -r test/e2e/fixtures/cortex-m3 "$work/project"
          set +e
          node dist/eide_cli.js build --project "$work/project" --toolchain-path /usr --timeout 120000 \
            > "$work/first.json" 2> "$work/first.log"
          first_status=$?
          set -e
          sed -i 's/counter++;/counter++/' "$work/project/src/main.c"
          set +e
          node dist/eide_cli.js build --project "$work/project" --toolchain-path /usr --timeout 120000 \
            > "$work/second.json" 2> "$work/second.log"
          second_status=$?
          set -e
          node -e '
            const fs = require("fs");
            const [firstStatus, secondStatus, firstPath, secondPath] = process.argv.slice(1);
            const first = JSON.parse(fs.readFileSync(firstPath, "utf8"));
            const second = JSON.parse(fs.readFileSync(secondPath, "utf8"));
            const fail = message => {
              console.error(`FAIL: ${message}`);
              console.error(JSON.stringify({ firstStatus, secondStatus, first, second }, null, 2));
              process.exit(1);
            };
            if (Number(firstStatus) !== 0 || first.success !== true) fail("first build");
            if (Number(secondStatus) !== 2) fail("second exit code");
            if (second.success !== false) fail("second success");
            if (!Array.isArray(second.artifacts) || second.artifacts.length !== 0) fail("artifacts");
            if (second.failureKind !== "build") fail("failureKind");
            if (!first.buildId || first.buildId === second.buildId) fail("buildId");
            if (!first.configHash || first.configHash !== second.configHash) fail("configHash");
            if (second.stage !== "compile") fail("stage");
            console.log("failure contract verified");
          ' "$first_status" "$second_status" "$work/first.json" "$work/second.json"

      - name: Run QEMU GDB/MI session test
        timeout-minutes: 10
        shell: bash
        env:
          ARM_GDB: gdb-multiarch
          QEMU_SYSTEM_ARM: qemu-system-arm
          EIDE_REQUIRE_QEMU_DEBUG: '1'
        run: |
          set -euo pipefail
          npx tsc -p ./ && npx tsc -p test
          node out/tmp/test/scripts/debug-qemu-session.test.js | tee "$RUNNER_TEMP/qemu-debug.log"
          grep -q 'QEMU DEBUG SESSION RAN' "$RUNNER_TEMP/qemu-debug.log"

  toolchain-builds:
    name: Toolchain build (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: mcs51_sdcc
            apt_package: sdcc
            expected_binary: sdcc
            artifact_extensions: .hex,.ihx
          - template: stm8s_sdcc
            apt_package: sdcc
            expected_binary: sdcc
            required_binaries: sdcc,sdasstm8
            artifact_extensions: .hex,.ihx
          - template: avr_atmega128_rtos
            apt_package: gcc-avr,avr-libc
            expected_binary: avr-gcc
            required_binaries: avr-gcc,avr-g++,avr-objcopy,avr-ar,avr-ld
            artifact_extensions: .elf,.hex,.bin
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v5

      - name: Init submodules
        timeout-minutes: 5
        run: git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --recursive

      - name: Setup Node.js 18
        timeout-minutes: 5
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Setup .NET runtime
        timeout-minutes: 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies and toolchain
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=5 update
          IFS=',' read -r -a packages <<< "${{ matrix.apt_package }}"
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 install -y --no-install-recommends "${packages[@]}"
          test -x "/usr/bin/${{ matrix.expected_binary }}"

      - name: Build extension and headless bundles
        timeout-minutes: 15
        run: npm run vscode:prepublish

      - name: Verify toolchain build
        timeout-minutes: 10
        run: node scripts/verify-toolchain-build.js "${{ matrix.template }}" "${{ matrix.apt_package }}" "${{ matrix.expected_binary }}" "${{ matrix.artifact_extensions }}" "${{ matrix.required_binaries }}"
