name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version to publish from dev (for example v4.3.5)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build release packages
    if: github.event_name == 'push' || github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Init submodules
        run: git -c url."https://github.com/".insteadOf="git@github.com:" submodule update --init --recursive

      - name: Setup Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$tag_version" != "$package_version" ]]; then
            echo "::error::Expected release tag v${package_version} for this source revision."
            exit 1
          fi
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"

      - name: Require Open VSX token
        if: github.event_name == 'push'
        shell: bash
        env:
          OPEN_VSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        run: |
          if [ -z "$OPEN_VSX_PAT" ]; then
            echo "::error::Repository secret OPEN_VSX_PAT is required to publish to Open VSX."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build extension and headless bundles
        run: npm run vscode:prepublish

      - name: Run tests
        run: npm test

      - name: Verify build artifacts
        shell: bash
        run: |
          missing=()
          for artifact in extension.js mcp_server.js eide_cli.js eide_mcp.js; do
            if [ ! -f "dist/$artifact" ]; then
              missing+=("dist/$artifact")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing build artifacts: ${missing[*]}"
            exit 1
          fi

      - name: Setup Node.js 22 for VSIX tooling
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify VSIX contents before packaging
        run: npm run verify:vsix

      - name: Package headless distribution
        if: github.event_name == 'push'
        run: npm run package:headless

      - name: Package VSIX
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npx --yes @vscode/vsce@2.15.0 package --out "eide-pro-${VERSION}.vsix"

      - name: Verify VSIX contents
        if: github.event_name == 'push'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          unexpected="$(unzip -Z1 "eide-pro-${VERSION}.vsix" \
            | grep -E '^extension/(artifacts|coverage|out|src|test|scripts)/' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::VSIX contains development or packaging output:"
            echo "$unexpected"
            exit 1
          fi

      - name: Package MCP skill archive
        if: github.event_name == 'push'
        shell: bash
        run: |
          cd docs/skills
          zip -q -X "$GITHUB_WORKSPACE/eide-mcp-tools-skill.zip" eide-mcp-tools/SKILL.md
          entries="$(unzip -Z1 "$GITHUB_WORKSPACE/eide-mcp-tools-skill.zip")"
          if [ "$entries" != "eide-mcp-tools/SKILL.md" ]; then
            echo "::error::eide-mcp-tools-skill.zip has unexpected entries: ${entries}"
            exit 1
          fi

      - name: Write SHA-256 checksums for every release asset
        if: github.event_name == 'push'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for artifact in "eide-pro-${VERSION}.vsix" "artifacts/eide-pro-headless-${VERSION}.tgz" "eide-mcp-tools-skill.zip"; do
            digest="$(sha256sum "$artifact" | awk '{print $1}')"
            base="$(basename "$artifact")"
            printf '%s  %s\n' "$digest" "$base" > "${base}.sha256"
            echoed="$(awk '{print $1}' "${base}.sha256")"
            if [ "$echoed" != "$digest" ]; then
              echo "::error::checksum round-trip failed for ${base}"
              exit 1
            fi
          done
          ls -la ./*.sha256

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: EIDE AI ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            eide-pro-${{ steps.version.outputs.version }}.vsix
            eide-pro-${{ steps.version.outputs.version }}.vsix.sha256
            artifacts/eide-pro-headless-${{ steps.version.outputs.version }}.tgz
            eide-pro-headless-${{ steps.version.outputs.version }}.tgz.sha256
            eide-mcp-tools-skill.zip
            eide-mcp-tools-skill.zip.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Open VSX
        if: github.event_name == 'push'
        env:
          OPEN_VSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
          VSIX_FILE: eide-pro-${{ steps.version.outputs.version }}.vsix
        run: npx --yes ovsx@1.4.0 publish "$VSIX_FILE" --pat "$OPEN_VSX_PAT"

      - name: Package Marketplace VSIX
        if: github.event_name == 'workflow_dispatch' || vars.VS_MARKETPLACE_ENABLED == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/eide-package.json"
          cp package.json "$backup"
          trap 'cp "$backup" package.json' EXIT
          npm pkg set name=eide-ai
          mkdir -p "$RUNNER_TEMP/marketplace"
          npx --yes @vscode/vsce@2.15.0 package --out "$RUNNER_TEMP/marketplace/eide-ai-$VERSION.vsix"

      - name: Transfer Marketplace VSIX to the publishing job
        if: github.event_name == 'workflow_dispatch' || vars.VS_MARKETPLACE_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-vsix
          path: ${{ runner.temp }}/marketplace/eide-ai-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error

  vscode-marketplace:
    name: Publish to VS Code Marketplace
    needs: release
    if: >-
      ${{ github.repository == 'wuwuzhazha/eide-pro' && (
        (github.event_name == 'push' && vars.VS_MARKETPLACE_ENABLED == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node.js 22 for Marketplace tooling
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download Marketplace VSIX
        uses: actions/download-artifact@v4
        with:
          name: marketplace-vsix
          path: ${{ runner.temp }}/marketplace

      - name: Verify Marketplace VSIX
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          vsix="$RUNNER_TEMP/marketplace/eide-ai-$version.vsix"
          unzip -p "$vsix" extension/package.json | node -e '
            const pkg = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (pkg.publisher !== "wuwuzhazha" || pkg.name !== "eide-ai" || pkg.displayName !== "EIDE AI" || pkg.version !== process.argv[1]) {
              throw new Error("VSIX identity or version does not match the expected Marketplace release");
            }
          ' "$version"
          entries="$(unzip -Z1 "$vsix")"
          if grep -E '^extension/(artifacts|coverage|out|src|test|scripts)/' <<< "$entries"; then
            echo "::error::Marketplace VSIX contains development or packaging output."
            exit 1
          fi
          echo "VSIX_PATH=$vsix" >> "$GITHUB_ENV"

      - name: Publish the verified VSIX using Trusted Publishing
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath "$VSIX_PATH"
